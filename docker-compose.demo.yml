services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: dps
      POSTGRES_USER: dps
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dps-demo-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dps -d dps"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &app-env
      ENVIRONMENT: demo
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      DATABASE_URL: postgresql+asyncpg://dps:${POSTGRES_PASSWORD:-dps-demo-change-me}@postgres:5432/dps
      STORAGE_ROOT: /data/storage
      AUTO_CREATE_SCHEMA: "false"
      EXPOSE_DEMO_RESET_TOKEN: "false"
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@dps.example.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?Set DEFAULT_ADMIN_PASSWORD}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-groq}
      SUMMARIZATION_PROVIDER: ${SUMMARIZATION_PROVIDER:-groq}
      FORM_EXTRACTION_PROVIDER: ${FORM_EXTRACTION_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_TRANSCRIPTION_MODEL: ${GROQ_TRANSCRIPTION_MODEL:-whisper-large-v3}
      GROQ_SUMMARY_MODEL: ${GROQ_SUMMARY_MODEL:-openai/gpt-oss-120b}
      GROQ_FORM_MODEL: ${GROQ_FORM_MODEL:-qwen/qwen3.8-27b}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      METRICS_ENABLED: "true"
    volumes:
      - audio_data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    environment: *app-env
    volumes:
      - audio_data:/data/storage
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["python", "-m", "app.workers.runner"]
    environment: *app-env
    volumes:
      - audio_data:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  audio_data:
