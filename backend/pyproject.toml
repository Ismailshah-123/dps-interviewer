[project]
name = "dps-interview-backend"
version = "0.1.0"
description = "AI-assisted DPS student interview documentation backend"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.120,<1",
  "uvicorn[standard]>=0.38,<1",
  "sqlalchemy[asyncio]>=2.0.44,<2.1",
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.21,<1",
  "alembic>=1.17,<2",
  "pydantic-settings>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "argon2-cffi>=25.1,<26",
  "PyJWT>=2.10,<3",
  "email-validator>=2.3,<3",
  "httpx>=0.28,<1",
  "reportlab>=4.4,<5",
  "orjson>=3.11,<4",
  "slowapi>=0.1.9,<1",
  "prometheus-client>=0.23,<1",
  "arabic-reshaper>=3.0,<4",
  "python-bidi>=0.6,<1",
]

[project.optional-dependencies]
ai = [
  "faster-whisper>=1.2,<2",
  # faster-whisper 1.2.1 passes an argument PyAV 17+ removed.
  "av>=15,<17",
]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.14,<1",
  "mypy>=1.18,<2",
  "respx>=0.22,<1",
  "pypdf>=5,<7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
